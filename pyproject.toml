[project]
name = "ayc"
version = "0.1.0"
description = "Ask a YouTube channel — local CLI prototype for ingesting and querying a channel's video Q&A and objection/rebuttal moments."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.51.0",
    "openai>=1.50.0",
    "yt-dlp>=2025.1.0",
    "typer>=0.13.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "numpy>=2.0.0",
]

[project.scripts]
ayc = "ayc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ayc"]
